<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT Vocab Pro System</title>
    <link rel="icon" type="image/png" href="unnamed.png?v=20260928">
    <link rel="apple-touch-icon" href="unnamed.png?v=20260928">
    <link rel="stylesheet" href="header.css">
    <script src="header.js" defer></script>
    <style>
        :root {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --primary: #2b6cb0;
            --primary-hover: #2c5282;
            --accent: #e53e3e;
            --success: #38a169;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-top: 0; color: var(--primary); }

        /* Navigation */
        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav button {
            background-color: var(--card-bg);
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .nav button.active, .nav button:hover {
            background-color: var(--primary);
            color: white;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 24px;
            box-sizing: border-box;
            min-height: 400px;
            position: relative;
        }

        /* Flashcard Mode */
        .flashcard-area { display: none; text-align: center; }
        .word-title { font-size: 2.5em; font-weight: bold; color: var(--primary); margin-bottom: 5px; }
        .respelling { color: var(--text-muted); font-style: italic; margin-bottom: 20px; }
        .definition-en { font-size: 1.1em; color: var(--text-main); margin-bottom: 10px; font-weight: 500; }
        .definition-cn { font-size: 1.2em; color: var(--accent); margin-bottom: 20px; }
        .sentences { text-align: left; font-size: 0.95em; line-height: 1.5; color: var(--text-muted); background: var(--bg); padding: 15px; border-radius: 8px;}
        .sentences ul { margin: 0; padding-left: 20px; }
        .sentences li { margin-bottom: 8px; }

        /* Spelling Mode */
        .spelling-area { display: none; text-align: center; }
        .spell-hint { font-size: 1.1em; margin-bottom: 20px; line-height: 1.5;}
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 1.2em;
            border: 2px solid var(--border);
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        input[type="text"]:focus { outline: none; border-color: var(--primary); }

        /* MCQ Mode */
        .mcq-area { display: none; }
        .mcq-word { font-size: 2em; text-align: center; color: var(--primary); margin-bottom: 20px; font-weight: bold;}
        .option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
        }
        .option-btn:hover { background: #e2e8f0; }
        .option-btn.correct { background: var(--success); color: white; border-color: var(--success); }
        .option-btn.wrong { background: var(--accent); color: white; border-color: var(--accent); }

        /* Review Mode */
        .review-area { display: none; }
        .review-list { list-style: none; padding: 0; }
        .review-list li {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        /* Controls */
        .controls { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn-action {
            background-color: var(--primary); color: white; border: none; padding: 10px 20px;
            border-radius: 8px; cursor: pointer; font-size: 1em; font-weight: bold;
        }
        .btn-action:hover { background-color: var(--primary-hover); }
        .feedback { font-weight: bold; margin-top: 15px; min-height: 24px; text-align: center;}
        
        .show { display: block !important; }
    </style>
</head>
<body>

    <h1>SAT Vocab Pro</h1>
    <div class="nav">
        <button id="nav-flash" class="active" onclick="switchMode('flash')">Flashcards</button>
        <button id="nav-spell" onclick="switchMode('spell')">Spelling Quiz</button>
        <button id="nav-mcq" onclick="switchMode('mcq')">MCQ Practice</button>
        <button id="nav-review" onclick="switchMode('review')">Needs Review (<span id="review-count">0</span>)</button>
    </div>

    <div class="container">
        <div id="area-flash" class="flashcard-area show">
            <div id="flash-front">
                <div class="word-title" id="f-word">Word</div>
                <div class="respelling" id="f-respelling">[respelling]</div>
                <button class="btn-action" style="margin-top:40px;" onclick="toggleFlashcard()">Show Meaning & Sentences</button>
            </div>
            <div id="flash-back" style="display:none;">
                <div class="definition-cn" id="f-cn">中文释义</div>
                <div class="definition-en" id="f-en">English Definition</div>
                <div class="sentences">
                    <strong>Examples:</strong>
                    <ul id="f-sentences"></ul>
                </div>
                <button class="btn-action" style="margin-top:20px;" onclick="nextFlashcard()">Next Word ➡</button>
            </div>
        </div>

        <div id="area-spell" class="spelling-area">
            <h3>Spell the Word</h3>
            <div class="spell-hint">
                <strong style="color: var(--accent);" id="s-cn">中文</strong><br>
                <span id="s-en" style="color: var(--text-muted);">English def</span>
            </div>
            <input type="text" id="s-input" placeholder="Type word here..." autocomplete="off">
            <div class="controls" style="justify-content: center;">
                <button class="btn-action" onclick="checkSpelling()">Check</button>
                <button class="btn-action" style="margin-left: 10px; background-color: var(--text-muted);" onclick="nextSpelling()">Skip/Next</button>
            </div>
            <div id="s-feedback" class="feedback"></div>
        </div>

        <div id="area-mcq" class="mcq-area">
            <h3>Choose the correct meaning</h3>
            <div class="mcq-word" id="m-word">Word</div>
            <div id="m-options"></div>
            <div class="controls" style="justify-content: flex-end;">
                <button class="btn-action" onclick="nextMCQ()">Next ➡</button>
            </div>
            <div id="m-feedback" class="feedback"></div>
        </div>

        <div id="area-review" class="review-area">
            <h3>Needs Review (Spelled Incorrectly)</h3>
            <p style="font-size: 0.9em; color: var(--text-muted);">Words you misspell are automatically added here.</p>
            <ul class="review-list" id="r-list"></ul>
        </div>
    </div>

        let currentIndex = 0;
        let mcqAnswer = "";

        // UI Routing
        function switchMode(mode) {
            document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`nav-${mode}`).classList.add('active');
            
            document.querySelectorAll('.container > div').forEach(div => div.classList.remove('show'));
            document.getElementById(`area-${mode}`).classList.add('show');

            if (mode === 'flash') loadFlashcard();
            if (mode === 'spell') loadSpelling();
            if (mode === 'mcq') loadMCQ();
            if (mode === 'review') loadReview();
        }

        // --- FLASHCARD MODE ---
        function loadFlashcard() {
            document.getElementById('flash-front').style.display = 'block';
            document.getElementById('flash-back').style.display = 'none';
            
            const wordObj = vocabData[currentIndex];
            document.getElementById('f-word').innerText = wordObj.word;
            document.getElementById('f-respelling').innerText = `[ ${wordObj.respelling} ]`;
            document.getElementById('f-cn').innerText = wordObj.cn;
            document.getElementById('f-en').innerText = wordObj.en;
            
            const ul = document.getElementById('f-sentences');
            ul.innerHTML = '';
            wordObj.sentences.forEach(s => {
                let li = document.createElement('li');
                li.innerText = s;
                ul.appendChild(li);
            });
        }

        function toggleFlashcard() {
            document.getElementById('flash-front').style.display = 'none';
            document.getElementById('flash-back').style.display = 'block';
        }

        function nextFlashcard() {
            currentIndex = (currentIndex + 1) % vocabData.length;
            loadFlashcard();
        }

        // --- SPELLING MODE ---
        function loadSpelling() {
            const wordObj = vocabData[currentIndex];
            document.getElementById('s-cn').innerText = wordObj.cn;
            document.getElementById('s-en').innerText = wordObj.en;
            document.getElementById('s-input').value = '';
            document.getElementById('s-feedback').innerText = '';
            document.getElementById('s-feedback').style.color = '';
            document.getElementById('s-input').focus();
        }

        function checkSpelling() {
            const input = document.getElementById('s-input').value.trim().toLowerCase();
            const correctWord = vocabData[currentIndex].word.toLowerCase();
            const feedback = document.getElementById('s-feedback');

            if (input === correctWord) {
                feedback.innerText = "Correct! ✅";
                feedback.style.color = "var(--success)";
                setTimeout(nextSpelling, 1000);
            } else {
                feedback.innerHTML = `Incorrect ❌. The word is <strong>${vocabData[currentIndex].word}</strong>`;
                feedback.style.color = "var(--accent)";
                vocabData[currentIndex].failed = true; // Mark as failed
                updateReviewCount();
            }
        }

        function nextSpelling() {
            currentIndex = (currentIndex + 1) % vocabData.length;
            loadSpelling();
        }

        document.getElementById('s-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkSpelling();
        });

        // --- MCQ MODE ---
        function loadMCQ() {
            const wordObj = vocabData[currentIndex];
            document.getElementById('m-word').innerText = wordObj.word;
            document.getElementById('m-feedback').innerText = '';
            
            // Get 1 correct and 3 random wrong definitions
            let options = [{ cn: wordObj.cn, correct: true }];
            let wrongPool = vocabData.filter(v => v.word !== wordObj.word);
            // Shuffle wrong pool
            wrongPool.sort(() => 0.5 - Math.random());
            
            for(let i=0; i<3 && i<wrongPool.length; i++){
                options.push({ cn: wrongPool[i].cn, correct: false });
            }
            
            // Shuffle options
            options.sort(() => 0.5 - Math.random());
            
            const optionsDiv = document.getElementById('m-options');
            optionsDiv.innerHTML = '';
            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.cn;
                btn.onclick = () => handleMCQClick(btn, opt.correct, wordObj.cn);
                optionsDiv.appendChild(btn);
            });
        }

        function handleMCQClick(btn, isCorrect, correctCn) {
            // Disable all buttons
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.style.pointerEvents = 'none');

            const feedback = document.getElementById('m-feedback');
            if (isCorrect) {
                btn.classList.add('correct');
                feedback.innerText = "Correct! ✅";
                feedback.style.color = "var(--success)";
                setTimeout(nextMCQ, 1000);
            } else {
                btn.classList.add('wrong');
                feedback.innerText = `Incorrect ❌. Correct answer: ${correctCn}`;
                feedback.style.color = "var(--accent)";
                vocabData[currentIndex].failed = true;
                updateReviewCount();
            }
        }

        function nextMCQ() {
            currentIndex = (currentIndex + 1) % vocabData.length;
            loadMCQ();
        }

        // --- REVIEW MODE ---
        function updateReviewCount() {
            const count = vocabData.filter(v => v.failed).length;
            document.getElementById('review-count').innerText = count;
        }

        function loadReview() {
            const list = document.getElementById('r-list');
            list.innerHTML = '';
            const failedWords = vocabData.filter(v => v.failed);
            
            if(failedWords.length === 0) {
                list.innerHTML = "<li style='color:var(--success); justify-content:center;'>Great job! No words to review.</li>";
                return;
            }

            failedWords.forEach(wordObj => {
                let li = document.createElement('li');
                li.innerHTML = `<strong>${wordObj.word}</strong> <span>${wordObj.cn}</span>`;
                list.appendChild(li);
            });
        }

        // Initialize
        loadFlashcard();
        updateReviewCount();
    </script>
